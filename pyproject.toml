[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "adaptive-beamforming-simulation"
version = "1.0.0"
description = "Adaptive beamforming, DOA estimation and embedded DSP reference framework (receive-only)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Joachim Nadal" }]
dependencies = ["numpy>=1.26", "matplotlib>=3.8", "pillow>=10"]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov>=5", "ruff>=0.5", "mypy>=1.10", "scipy>=1.11"]
ai = ["torch>=2.2"]

[tool.setuptools.packages.find]
include = ["dsp*", "simulations*", "ai*", "dashboard*", "embedded*", "examples*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "ccore: needs a C compiler and CMake (skipped when unavailable)",
    "torch: needs PyTorch (skipped when unavailable)",
]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "NPY", "RUF"]
# RUF001-003: Greek letters and minus signs are intentional in DSP text.
ignore = ["RUF001", "RUF002", "RUF003", "RUF005"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
check_untyped_defs = true
packages = ["dsp", "simulations", "embedded", "ai", "dashboard"]
